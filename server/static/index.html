<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ENA Browser</title>
<link rel="stylesheet" href="/static/vendor/ena-browser/ena-browser.css" />
<style>
  :root, :root[data-theme="dark"] {
    --bg:#0f1419; --panel:#1a2129; --line:#2c3540; --fg:#e6edf3; --muted:#8b98a5;
    --accent:#008272; --ok:#117733; --bad:#CC3333; --warn:#FF6600;
    --btn2-bg:#30363d; --btn2-fg:#fff;
  }
  :root[data-theme="light"] {
    --bg:#ffffff; --panel:#f6f8fa; --line:#d0d7de; --fg:#1f2328; --muted:#636c76;
    --accent:#003366; --ok:#117733; --bad:#CC3333; --warn:#FF6600;
    --btn2-bg:#e1e4e8; --btn2-fg:#1f2328;
  }
  * { box-sizing:border-box; }
  html, body { overscroll-behavior-x:none; }
  body { margin:0; font:14px/1.5 "Open Sans",Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:16px; padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header .spacer { flex:1; }
  label.switch { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); }
  .pill { padding:2px 10px; border-radius:12px; font-size:12px; font-weight:600; }
  .pill.test { background:#0d2e1a; color:#6ecf7f; }
  .pill.prod { background:#2e0d0d; color:#e87070; }
  .creds-status { font-size:12px; color:var(--muted); }
  .creds-status.on { color:#6ecf7f; }
  nav { display:flex; gap:2px; background:var(--panel); padding:0 12px; border-bottom:1px solid var(--line); }
  nav button { background:none; border:none; color:var(--muted); padding:10px 16px; cursor:pointer; font-size:14px; border-bottom:2px solid transparent; }
  nav button.active { color:var(--fg); border-bottom-color:var(--accent); }
  main { padding:12px 18px 24px; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  button, select, input { font:inherit; }
  button { background:var(--accent); color:#fff; border:none; border-radius:5px; padding:6px 12px; cursor:pointer; }
  button.secondary { background:var(--btn2-bg); color:var(--btn2-fg); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  input[type=text], input[type=password] { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:5px; padding:6px 8px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; margin-bottom:12px; }
  .muted { color:var(--muted); }
  .banner { display:none; padding:8px 10px; border-radius:5px; margin-bottom:10px; white-space:pre-wrap; }
  .banner.show { display:block; }
  .banner.ok { background:rgba(17,119,51,.18); border:1px solid var(--ok); }
  .banner.bad { background:rgba(204,51,51,.18); border:1px solid var(--bad); }
  .banner.warn { background:rgba(255,102,0,.15); border:1px solid var(--warn); }
  dialog { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; max-width:min(720px,90vw); }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  dialog table { border-collapse:collapse; width:100%; font-size:13px; }
  dialog th, dialog td { border-bottom:1px solid var(--line); padding:4px 8px; text-align:left; }
</style>
</head>
<body>
<header>
  <h1>ENA Browser</h1>
  <span id="envPill" class="pill test">TEST</span>
  <label class="switch"><input type="checkbox" id="prodToggle" /> production</label>
  <label class="switch"><input type="checkbox" id="writeToggle" /> write mode</label>
  <span class="spacer"></span>
  <span id="credStatus" class="creds-status">credentials: not set</span>
  <label class="switch">theme
    <select id="themeSelect">
      <option value="system">system</option>
      <option value="dark">dark</option>
      <option value="light">light</option>
    </select>
  </label>
  <button class="secondary" id="credToggle">credentials</button>
</header>

<nav id="tabs"></nav>

<main>
  <div id="credPanel" class="panel" hidden>
    <div class="row">
      <input type="text" id="username" placeholder="Webin-12345" autocomplete="username" />
      <input type="password" id="password" placeholder="password" autocomplete="current-password" />
      <button id="credSave">Save</button>
      <button class="secondary" id="credValidate">Validate</button>
      <button class="secondary" id="credClear">Clear</button>
    </div>
    <p class="muted" style="margin:0">
      Held in this browser tab only (<code>sessionStorage</code>), sent as request headers,
      never written to disk and never stored on the server.
    </p>
  </div>

  <div id="banner" class="banner"></div>

  <div class="row">
    <button id="reload">Reload</button>
    <span id="rowCount" class="muted">no records loaded</span>
    <span class="spacer" style="flex:1"></span>
    <button class="secondary" id="undo" title="Undo (⌘Z)" disabled>↶ Undo</button>
    <button class="secondary" id="redo" title="Redo (⇧⌘Z)" disabled>↷ Redo</button>
    <button id="submit" disabled>Submit changes</button>
  </div>

  <ena-browser id="grid" entity="studies" mode="read" height="600"></ena-browser>
</main>

<dialog id="diffDialog">
  <form method="dialog">
    <h3 style="margin-top:0">Submit these changes to ENA?</h3>
    <p id="diffEnv" class="muted"></p>
    <div style="max-height:50vh; overflow:auto"><table id="diffTable"></table></div>
    <div class="row" style="justify-content:flex-end; margin:12px 0 0">
      <button class="secondary" value="cancel">Cancel</button>
      <button value="ok">Submit</button>
    </div>
  </form>
</dialog>

<script src="/static/vendor/ena-browser/ena-browser.iife.js"></script>
<script src="/static/theme.js"></script>
<script src="/static/app.js"></script>
<script src="/static/creds.js"></script>
<script src="/static/state.js"></script>
<script src="/static/undo.js"></script>
<script src="/static/records.js"></script>
</body>
</html>
